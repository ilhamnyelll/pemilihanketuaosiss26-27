<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>PILKETOS - Pemilihan Ketua OSIS</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar bg-primary navbar-dark shadow-sm">
  <div class="container">
    <span class="navbar-brand fw-bold">
      🗳️ PILKETOS
    </span>
  </div>
</nav>


<main class="container py-5">

  <!-- LOGIN / ABSEN -->

  <section
    id="loginPage"
    class="card login-card shadow mx-auto p-4"
  >

    <div class="text-center mb-4">

      <div class="login-icon">
        🗳️
      </div>

      <h2 class="fw-bold mt-3">
        Pemilihan Ketua OSIS
      </h2>

      <p class="text-muted">
        Silakan isi nama, kelas, dan nomor absen.
      </p>

    </div>


    <!-- NAMA -->

    <label
      for="voterName"
      class="form-label fw-semibold"
    >
      Nama Lengkap
    </label>

    <input
      id="voterName"
      type="text"
      class="form-control form-control-lg mb-3"
      placeholder="Masukkan nama lengkap"
      autocomplete="name"
    >


    <!-- KELAS -->

    <label
      for="voterClass"
      class="form-label fw-semibold"
    >
      Kelas
    </label>

    <select
      id="voterClass"
      class="form-select form-select-lg mb-3"
    >

      <option value="">
        -- Pilih Kelas --
      </option>

      <option value="VII A">VII A</option>
      <option value="VII B">VII B</option>
      <option value="VII C">VII C</option>

      <option value="VIII A">VIII A</option>
      <option value="VIII B">VIII B</option>
      <option value="VIII C">VIII C</option>

      <option value="IX A">IX A</option>
      <option value="IX B">IX B</option>
      <option value="IX C">IX C</option>

    </select>


    <!-- ABSEN -->

    <label
      for="voterAbsent"
      class="form-label fw-semibold"
    >
      Nomor Absen
    </label>

    <select
      id="voterAbsent"
      class="form-select form-select-lg mb-3"
    >

      <option value="">
        -- Pilih Nomor Absen --
      </option>

    </select>


    <button
      type="button"
      onclick="loginVoter()"
      class="btn btn-primary btn-lg w-100"
    >
      Mulai Voting
    </button>


    <div
      id="loginMsg"
      class="text-danger text-center mt-3"
    ></div>

  </section>


  <!-- VOTING -->

  <section
    id="votePage"
    class="d-none"
  >

    <div class="text-center mb-5">

      <h1 class="fw-bold">
        Pilih Pasangan Calon
      </h1>

      <p class="text-muted">
        Pilih salah satu pasangan calon.
      </p>

    </div>


    <div
      id="candidateList"
      class="row g-4 justify-content-center"
    ></div>

  </section>


  <!-- TERIMA KASIH -->

  <section
    id="thankPage"
    class="d-none text-center py-5"
  >

    <div class="success-icon">
      ✓
    </div>

    <h1 class="fw-bold mt-4">
      Terima Kasih!
    </h1>

    <p class="text-muted fs-5">
      Suara Anda telah berhasil dicatat.
    </p>

  </section>

</main>


<!-- MODAL KONFIRMASI -->

<div
  class="modal fade"
  id="confirmModal"
  tabindex="-1"
  aria-hidden="true"
>

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div class="modal-header">

        <h5 class="modal-title fw-bold">
          Konfirmasi Pilihan
        </h5>

        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
        ></button>

      </div>


      <div
        class="modal-body text-center py-4"
        id="confirmText"
      ></div>


      <div class="modal-footer">

        <button
          type="button"
          class="btn btn-secondary"
          data-bs-dismiss="modal"
        >
          Batal
        </button>

        <button
          type="button"
          class="btn btn-primary"
          onclick="confirmVote()"
        >
          Ya, Pilih
        </button>

      </div>

    </div>

  </div>

</div>


<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

<script src="script.js"></script>

</body>
</html>
